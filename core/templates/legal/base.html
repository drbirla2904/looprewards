<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{% endblock %} – OFFLet</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;600;700&display=swap">
<style>
:root{color-scheme:light;--ink:#1c1530;--muted:#7a7391;--line:#e7e2f1;--brand:#5e35b1;--canvas:#f5f2fa}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--ink);font:15px/1.75 Inter,"Noto Sans Devanagari",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse at 82% 0%,rgba(233,224,250,.55),transparent 38%),var(--canvas)}
a{color:var(--brand);text-underline-offset:3px}
.legal-header{position:sticky;top:0;z-index:10;min-height:72px;padding:12px max(24px,calc((100vw - 1140px)/2));display:flex;align-items:center;justify-content:space-between;gap:24px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.legal-brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;text-decoration:none;letter-spacing:-.3px}
.legal-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#f0eafa;color:var(--brand);font-weight:800;transition:transform .22s ease,box-shadow .22s ease}
.legal-mark svg{width:26px;height:26px}
.legal-brand:hover .legal-mark{transform:rotate(-5deg) scale(1.05);box-shadow:0 6px 16px #5e35b124}
nav{display:flex;flex-wrap:wrap;gap:6px 20px}
nav a{color:#6b6485;font-size:12px;font-weight:550;text-decoration:none;transition:color .16s ease,transform .16s ease}
nav a:hover{color:var(--brand)}
.legal-login{flex:0 0 auto;padding:9px 14px;border:1px solid #5e35b1;border-radius:9px;background:#5e35b1;color:#fff;font-size:12px;font-weight:650;text-decoration:none;white-space:nowrap}
.legal-login:hover{background:#4a2a8f;color:#fff}
.legal-login[hidden]{display:none}
.legal-content{width:min(100% - 40px,900px);min-height:62vh;margin:36px auto;padding:clamp(24px,5vw,56px);border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.96);box-shadow:0 12px 32px #17211f09;animation:legalRise .42s cubic-bezier(.2,.7,.2,1) both}
@keyframes legalRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
h1{margin:0 0 14px;font-size:clamp(28px,4vw,36px);line-height:1.2;letter-spacing:-1px}
h2{margin:32px 0 10px;font-size:19px;line-height:1.35;letter-spacing:-.3px}
p,li{color:#4a4360}
table{width:100%;margin:18px 0;border-collapse:separate;border-spacing:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
td,th{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;transition:background .16s ease}
tbody tr:hover td{background:#f8f6fc}
th{background:#f4f0fb;color:#2e2748;font-size:12px;font-weight:650}
tr:last-child td{border-bottom:0}
td+td,th+th{border-left:1px solid var(--line)}
.legal-footer{width:min(100% - 40px,900px);margin:0 auto;padding:0 0 28px;color:var(--muted);font-size:12px}
.legal-menu-toggle,.legal-menu-backdrop{display:none}
@media(max-width:680px){
 .legal-header{min-height:62px;align-items:center;flex-direction:row;gap:8px;padding:10px 12px}
 .legal-brand{gap:7px}
 .legal-login{padding:9px 10px;font-size:11px}
 .legal-menu-toggle{display:flex;width:42px;height:42px;flex:0 0 42px;flex-direction:column;align-items:center;justify-content:center;gap:4px;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
 .legal-menu-toggle span{display:block;width:18px;height:2px;border-radius:2px;background:currentColor}
 .legal-header nav{position:fixed;z-index:20;inset:0 auto 0 0;width:min(300px,calc(100vw - 52px));height:100dvh;display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:82px 18px 24px;overflow-y:auto;background:#111b20;box-shadow:16px 0 40px #101b2033;transform:translateX(-105%);transition:transform .22s ease}
 body.platform-menu-open .legal-header nav{transform:translateX(0)}
 .legal-header nav a{padding:11px 12px;border-radius:8px;color:#d0dbd6;font-size:14px}
 .legal-header nav a:hover{background:#24332f;color:#fff}
 .legal-menu-backdrop{position:fixed;z-index:19;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;border-radius:0;background:#111b2070}
 body.platform-menu-open .legal-menu-backdrop{display:block}
 body.platform-menu-open{overflow:hidden}
 .legal-content{width:calc(100% - 24px);margin:16px auto;padding:22px;border-radius:12px;font-size:14px}
 table{font-size:12px}
 td,th{padding:9px}
 .legal-footer{width:calc(100% - 32px)}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
</style><style id="modern-public-design-system">
:root{--ink:#17231f;--muted:#718079;--line:#e4ebe7;--brand:#5e35b1;--canvas:#f4f0fb}
html{scroll-behavior:smooth}
body{background:radial-gradient(ellipse at 86% 0%,rgba(221,241,231,.45),transparent 34%),var(--canvas);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:-.01em}
::selection{background:#c9e8d9;color:#12382d}
.legal-header{min-height:74px;padding-inline:max(24px,calc((100vw - 1200px)/2));border-color:#e4ebe7;background:rgba(255,255,255,.82);box-shadow:0 1px 0 #ffffffb3}
.legal-brand{gap:11px;font-size:15px;letter-spacing:-.4px}
.legal-mark{width:38px;height:38px;border:1px solid #d5ecde;border-radius:12px;background:linear-gradient(145deg,#e7f7ec,#b9e4ca);color:#126644}
.legal-header nav{gap:7px}
.legal-header nav a{padding:9px 11px;border:1px solid transparent;border-radius:9px;color:#5d6c63;font-size:12px;font-weight:600;transition:background .16s ease,color .16s ease,border-color .16s ease}
.legal-header nav a:hover{border-color:#e3ece6;background:#f4f8f5;color:#126644}
.legal-content{width:min(100% - 48px,960px);margin:38px auto;padding:clamp(28px,5vw,64px);border-color:#e2ebe5;border-radius:20px;background:rgba(255,255,255,.96);box-shadow:0 4px 12px #163c2a08,0 22px 60px #163c2a08}
h1{color:#17231f;font-size:clamp(32px,5vw,44px);font-weight:740;letter-spacing:-1.6px}
h2{margin-top:36px;color:#24372c;font-size:21px;font-weight:690;letter-spacing:-.55px}
p,li{color:#53635a}
a{color:#5e35b1}
table{border-color:#e2ebe5;border-radius:13px}
td,th{padding:14px 16px}
th{background:#f4f8f5;color:#3b4e43;font-size:12px}
td{color:#53635a}
.legal-footer{color:#7a8980}
.legal-footer a{color:#536a5c}
.legal-menu-toggle{border-color:#e1e9e4;border-radius:11px;box-shadow:0 1px 3px #14281c08}
.legal-menu-toggle:focus-visible,.legal-header a:focus-visible{outline:3px solid #25a77b70;outline-offset:3px}
.legal-mark{border:0;background:url("/icon.svg") center/cover no-repeat}
.legal-mark svg{display:none}
@media(max-width:680px){
 .legal-header{min-height:64px;padding:10px 16px}
 .legal-menu-toggle{width:42px;height:42px}
 .legal-header nav{background:linear-gradient(180deg,#172a25,#111d20);box-shadow:16px 0 40px #101b2033}
 .legal-header nav a{border:0;border-radius:9px;color:#d0dbd6;font-size:14px}
 .legal-header nav a:hover{background:#ffffff10;color:#fff}
 .legal-content{width:calc(100% - 24px);margin:18px auto;padding:24px 20px;border-radius:16px}
 table{display:block;max-width:100%;overflow-x:auto;white-space:normal}
 td,th{min-width:110px;padding:10px}
 .legal-footer{width:calc(100% - 32px);line-height:1.7}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style></head><body>
<header class="legal-header"><a class="legal-brand" href="/app/"><span class="legal-mark"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M13 29V17a6 6 0 0 1 11-3M13 20h13" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><circle cx="27.5" cy="12.5" r="3" fill="#fff" stroke="#1b7651" stroke-width="1.5"/></svg></span>OFFLet</a><button class="legal-menu-toggle" type="button" aria-label="Open platform navigation" aria-expanded="false" aria-controls="platformNav"><span></span><span></span><span></span></button><nav id="platformNav" aria-label="Platform navigation"><a href="/app/">App</a><a href="/about/">About</a><a href="/pricing/">Pricing</a><a href="/shipping-delivery/">Shipping &amp; Delivery</a><a href="/privacy/">Privacy</a><a href="/terms/">Terms</a><a href="/refund/">Refunds</a><a href="/contact/">Contact</a></nav><a id="legalLogin" class="legal-login" href="/app/">Log in</a></header><button class="legal-menu-backdrop" type="button" aria-label="Close navigation" tabindex="-1"></button>
<main class="legal-content">{% block body %}{% endblock %}</main>
<footer class="legal-footer"><p>{{ c.name }} · {{ c.address }} · <a href="mailto:{{ c.email }}">{{ c.email }}</a>{% if c.phone %} · {{ c.phone }}{% endif %}</p></footer>
<script>
const menuToggle=document.querySelector('.legal-menu-toggle'),menuBackdrop=document.querySelector('.legal-menu-backdrop');
const legalLogin=document.querySelector('#legalLogin');legalLogin.hidden=!!localStorage.getItem('t');
function closePlatformMenu(){document.body.classList.remove('platform-menu-open');menuToggle.setAttribute('aria-expanded','false');menuToggle.setAttribute('aria-label','Open platform navigation')}
menuToggle.addEventListener('click',()=>{const open=menuToggle.getAttribute('aria-expanded')!=='true';document.body.classList.toggle('platform-menu-open',open);menuToggle.setAttribute('aria-expanded',String(open));menuToggle.setAttribute('aria-label',open?'Close platform navigation':'Open platform navigation')});
menuBackdrop.addEventListener('click',closePlatformMenu);
document.querySelectorAll('#platformNav a').forEach(link=>link.addEventListener('click',closePlatformMenu));
document.addEventListener('keydown',event=>{if(event.key==='Escape')closePlatformMenu()});
</script></body></html>
