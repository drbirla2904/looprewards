<style>

button,.btn{min-height:44px;border:1px solid var(--brand);background:var(--brand);color:#fff;font-weight:620;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;transition:background .16s ease,border-color .16s ease,transform .16s ease}

.err{color:var(--danger)}.bar{height:9px;margin:14px 0 8px;border-radius:999px;background:#e8eeeb;overflow:hidden}.bar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#14846f,#43b692)}

.customer-shop .task-pay{display:inline-flex;width:auto;margin:10px 8px 10px 0}
.customer-shop .entry-submit{margin-top:12px}

@keyframes riseIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.shell{background:radial-gradient(ellipse at 82% 0%,rgba(217,239,231,.42),transparent 38%),var(--canvas)}
.sidebar{background:linear-gradient(165deg,#172624 0%,#111b20 48%,#10191d 100%)}

button,.btn{border-radius:10px;box-shadow:0 2px 5px rgba(18,107,92,.1);transition:background .18s ease,border-color .18s ease,transform .18s ease,box-shadow .18s ease}
